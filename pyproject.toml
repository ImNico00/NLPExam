[project]
name = "nlp-exam"
version = "0.1.0"
description = "Dependency management for the NLP Exam repository."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Nico" }]
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
pandas = "^2.2.0"
ollama = "^0.4.0"
pillow = "^10.2.0"
transformers = "^4.41.0"
torch = [
    { version = "^2.6.0", markers = "sys_platform == 'darwin'" },
    { version = "^2.6.0", markers = "sys_platform != 'linux' and sys_platform != 'darwin'" },
    { version = "^2.6.0+cu124", source = "pytorch-cu124", markers = "sys_platform == 'linux'" },
]
torchvision = [
    { version = "^0.21.0", markers = "sys_platform == 'darwin'" },
    { version = "^0.21.0", markers = "sys_platform != 'linux' and sys_platform != 'darwin'" },
    { version = "^0.21.0+cu124", source = "pytorch-cu124", markers = "sys_platform == 'linux'" },
]
sentencepiece = "^0.2.1"
protobuf = "^7.35.0"
cairosvg = "^2.9.0"

[tool.poetry.group.dev.dependencies]
ipykernel = "*"
pandas-stubs = "<2.1"
pytest = "*"
python-pptx = "^1.0.2"

[[tool.poetry.source]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
priority = "explicit"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
